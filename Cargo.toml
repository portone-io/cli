[workspace]
resolver = "3"
members = ["crates/portone-cli", "crates/portone-schema-macros", "crates/xtask"]

[workspace.package]
# Kept in sync with the package.json version by scripts/sync-cargo-version.ts.
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/portone-io/cli"
authors = ["portone-dx <support@portone.io>"]

[profile.release]
strip = "symbols"
codegen-units = 1
lto = true
