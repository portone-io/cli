name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  scripts:
    name: Scripts (Node ${{ matrix.node }})
    strategy:
      matrix:
        node: [22.18.0, 24]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check script formatting and lint
        run: pnpm exec biome ci .

      - name: Typecheck scripts
        run: pnpm typecheck

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace

      - name: Reference docs up to date
        if: matrix.os == 'ubuntu-24.04'
        run: cargo xtask gen-docs --check

      - name: Plugin skills up to date
        if: matrix.os == 'ubuntu-24.04'
        run: cargo xtask sync-plugin-skills --check

      - name: Check musl target
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo check --workspace --target x86_64-unknown-linux-musl --all-targets

  vet:
    name: Supply chain (cargo vet)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install cargo-vet
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e
        with:
          tool: cargo-vet

      - name: Vet dependencies
        run: cargo vet --locked
