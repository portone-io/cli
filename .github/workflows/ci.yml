name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  scripts:
    name: Scripts (Node ${{ matrix.node }})
    strategy:
      matrix:
        node: [22.18.0, 24]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check script formatting and lint
        run: pnpm exec biome ci .

      - name: Typecheck scripts
        run: pnpm typecheck

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace

      - name: Reference docs up to date
        if: matrix.os == 'ubuntu-24.04'
        run: cargo xtask gen-docs --check

      - name: Plugin skills up to date
        if: matrix.os == 'ubuntu-24.04'
        run: cargo xtask sync-plugin-skills --check

      - name: Check musl target
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo check --workspace --target x86_64-unknown-linux-musl --all-targets

  vet:
    name: Supply chain (cargo vet)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install cargo-vet
        run: cargo install cargo-vet --version 0.10.2 --locked

      - name: Vet dependencies
        run: cargo vet --locked
